<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 580 450" role="img" aria-labelledby="title desc">
  <title id="title">Business automation reduces data entry errors</title>
  <desc id="desc">A nine-step workflow: identify repetitive data entry, connect systems, automate workflows, add validation, reduce duplicate entry, centralize data, automate reports, keep human oversight, and monitor improvements.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fafdff"/><stop offset="1" stop-color="#edf6ff"/></linearGradient>
    <linearGradient id="result" x2="1" y2="1"><stop stop-color="#143b76"/><stop offset="1" stop-color="#052254"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#1675df"/></marker>
    <style>
      .card{fill:#fff;stroke:#bcd8fa;stroke-width:1.2}.num{fill:#1266c7}.nt{font:700 12px Arial;fill:#fff}.head{font:700 9.4px Arial;fill:#15366d}.copy{font:7.2px Arial;fill:#34577e}.arr{fill:none;stroke:#1476df;stroke-width:2;marker-end:url(#arrow)}.ico{fill:#eaf4ff;stroke:#3079cc;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="580" height="450" rx="12" fill="url(#bg)"/>
  <path d="M0 0h74Q58 26 0 34M580 404v46h-65q35-15 65-46" fill="#d9efff" opacity=".8"/>
  <!-- First row -->
  <g transform="translate(20 22)"><rect class="card" width="116" height="96" rx="9"/><circle class="num" cx="17" cy="17" r="12"/><text class="nt" x="13" y="21">1</text><g class="ico"><circle cx="82" cy="21" r="8"/><path d="M82 15v12m-4-8 4-4 4 4M66 35h28v14H66zM70 39h8m-8 4h15"/></g><text class="head" x="10" y="51">Identify Repetitive</text><text class="head" x="10" y="63">Data Entry Tasks</text><text class="copy" x="10" y="76">Find repeated work across</text><text class="copy" x="10" y="85">customer, invoice and inventory</text></g>
  <path class="arr" d="M138 69h14"/>
  <g transform="translate(160 22)"><rect class="card" width="116" height="96" rx="9"/><circle class="num" cx="17" cy="17" r="12"/><text class="nt" x="13" y="21">2</text><g class="ico"><circle cx="79" cy="21" r="5"/><circle cx="96" cy="30" r="5"/><circle cx="70" cy="38" r="5"/><path d="M83 24l9 4m-17 7 9-10m-9 16 17-8"/></g><text class="head" x="10" y="57">Connect Your</text><text class="head" x="10" y="69">Business Systems</text><text class="copy" x="10" y="82">Integrate CRM, accounting</text><text class="copy" x="10" y="91">and inventory tools.</text></g>
  <path class="arr" d="M278 69h14"/>
  <g transform="translate(300 22)"><rect class="card" width="116" height="96" rx="9"/><circle class="num" cx="17" cy="17" r="12"/><text class="nt" x="13" y="21">3</text><g class="ico"><rect x="76" y="15" width="18" height="10" rx="2"/><path d="M85 25v7M72 32h26M74 32v9m11-9v9m11-9v9"/></g><text class="head" x="10" y="57">Use Automated</text><text class="head" x="10" y="69">Workflows</text><text class="copy" x="10" y="82">Set triggers for routine</text><text class="copy" x="10" y="91">steps like orders and invoices.</text></g>
  <path class="arr" d="M418 69h14"/>
  <g transform="translate(440 22)"><rect class="card" width="116" height="96" rx="9"/><circle class="num" cx="17" cy="17" r="12"/><text class="nt" x="13" y="21">4</text><g class="ico"><path d="M84 13 96 18v10c0 9-12 15-12 15S72 37 72 28V18z"/><path d="m78 28 4 4 8-9"/></g><text class="head" x="10" y="57">Add Validation Rules</text><text class="copy" x="10" y="72">Check required fields, formats,</text><text class="copy" x="10" y="82">duplicates and valid values</text><text class="copy" x="10" y="92">before saving.</text></g>
  <path class="arr" d="M498 120v17"/>
  <!-- Second row, right to left -->
  <g transform="translate(440 145)"><rect class="card" width="116" height="96" rx="9"/><circle class="num" cx="17" cy="17" r="12"/><text class="nt" x="13" y="21">5</text><g class="ico"><path d="M75 14h17l8 8v23H75zM92 14v9h8"/><path d="M80 29h14m-14 6h11m-11 6h8"/><circle cx="95" cy="42" r="7" fill="#fff"/></g><text class="head" x="10" y="58">Reduce Duplicate</text><text class="head" x="10" y="70">Data Entry</text><text class="copy" x="10" y="83">Reuse existing customer and</text><text class="copy" x="10" y="92">order information.</text></g>
  <path class="arr" d="M438 192h-14"/>
  <g transform="translate(300 145)"><rect class="card" width="116" height="96" rx="9"/><circle class="num" cx="17" cy="17" r="12"/><text class="nt" x="13" y="21">6</text><g class="ico"><ellipse cx="85" cy="18" rx="12" ry="5"/><path d="M73 18v23c0 7 24 7 24 0V18m-24 8c0 7 24 7 24 0m-24 8c0 7 24 7 24 0"/></g><text class="head" x="10" y="58">Create a Centralized</text><text class="head" x="10" y="70">Data Source</text><text class="copy" x="10" y="83">Keep current information</text><text class="copy" x="10" y="92">available to every team.</text></g>
  <path class="arr" d="M298 192h-14"/>
  <g transform="translate(160 145)"><rect class="card" width="116" height="96" rx="9"/><circle class="num" cx="17" cy="17" r="12"/><text class="nt" x="13" y="21">7</text><g class="ico"><rect x="73" y="14" width="24" height="26" rx="3"/><path d="M78 34v-6m6 6V21m6 13v-9m-17 18h28M79 19h12"/></g><text class="head" x="10" y="58">Automate Reports</text><text class="head" x="10" y="70">and Notifications</text><text class="copy" x="10" y="83">Schedule reports and alerts</text><text class="copy" x="10" y="92">for important events.</text></g>
  <path class="arr" d="M158 192h-14"/>
  <g transform="translate(20 145)"><rect class="card" width="116" height="96" rx="9"/><circle class="num" cx="17" cy="17" r="12"/><text class="nt" x="13" y="21">8</text><g class="ico"><circle cx="82" cy="26" r="9"/><path d="M82 20v12m-5-6h10M68 42h28m-22-4v-5m16 5v-5"/></g><text class="head" x="10" y="58">Keep Human Oversight</text><text class="head" x="10" y="70">Where It Matters</text><text class="copy" x="10" y="83">People handle exceptions,</text><text class="copy" x="10" y="92">decisions and approvals.</text></g>
  <path class="arr" d="M78 243v15"/>
  <!-- Third row -->
  <g transform="translate(20 265)"><rect class="card" width="116" height="78" rx="9"/><circle class="num" cx="17" cy="17" r="12"/><text class="nt" x="13" y="21">9</text><g class="ico"><path d="M68 17h31v22H68zM73 34l7-8 6 4 8-9"/><path d="M82 44h10m-5-5v5"/></g><text class="head" x="10" y="51">Monitor and Improve</text><text class="copy" x="10" y="64">Track errors, time and workflow</text><text class="copy" x="10" y="73">results to guide improvements.</text></g>
  <path class="arr" d="M138 304h16"/>
  <g transform="translate(164 274)"><rect width="194" height="60" rx="10" fill="url(#result)"/><circle cx="34" cy="30" r="17" fill="none" stroke="#d9edff" stroke-width="2"/><path d="m26 30 6 6 11-13" fill="none" stroke="#d9edff" stroke-width="2.5"/><path d="M62 10v40" stroke="#86b8f0"/><text x="74" y="25" font-family="Arial" font-size="12" font-weight="700" fill="#fff">The Result</text><text x="74" y="39" font-family="Arial" font-size="8" fill="#e7f3ff">Fewer errors. Faster processes.</text><text x="74" y="49" font-family="Arial" font-size="8" fill="#e7f3ff">Better data. More efficient teams.</text></g>
  <path class="arr" d="M360 304h14"/>
  <g transform="translate(380 276) rotate(-5)"><path d="M0 7Q38-5 72 7L66 53Q35 44 0 55z" fill="#e1f0ff"/><text x="10" y="22" font-family="Georgia" font-style="italic" font-size="10" fill="#23548b">Automate today</text><text x="12" y="34" font-family="Georgia" font-style="italic" font-size="10" fill="#23548b">for a stronger</text><text x="20" y="46" font-family="Georgia" font-style="italic" font-size="10" fill="#23548b">tomorrow.</text></g>
  <rect x="20" y="365" width="536" height="58" rx="9" fill="#e3f2ff"/>
  <g font-family="Arial" text-anchor="middle" fill="#17467f"><text x="72" y="389" font-size="18">◎</text><text x="72" y="406" font-size="8" font-weight="700">Higher Accuracy</text><text x="177" y="389" font-size="18">◷</text><text x="177" y="406" font-size="8" font-weight="700">Save Time</text><text x="282" y="389" font-size="18">↗</text><text x="282" y="406" font-size="8" font-weight="700">Boost Productivity</text><text x="387" y="389" font-size="18">▤</text><text x="387" y="406" font-size="8" font-weight="700">Lower Costs</text><text x="492" y="389" font-size="18">☆</text><text x="492" y="406" font-size="8" font-weight="700">Better Customer Experience</text></g>
</svg>
